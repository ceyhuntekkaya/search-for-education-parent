<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 8px;
            padding: 40px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .code-box {
            background-color: #f0f0f0;
            border-radius: 6px;
            padding: 20px;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 8px;
            color: #333333;
            margin: 30px 0;
        }
        .footer {
            text-align: center;
            color: #999999;
            font-size: 12px;
            margin-top: 30px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>Hoş Geldiniz!</h2>
    </div>

    <p>Merhaba <strong th:text="${username}"></strong>,</p>
    <p>Hesabınızı doğrulamak için aşağıdaki kodu kullanın:</p>

    <div class="code-box">
        <span th:text="${code}"></span>
    </div>

    <p>Bu kod <strong>10 dakika</strong> geçerlidir.</p>
    <p>Eğer bu işlemi siz yapmadıysanız bu maili görmezden gelebilirsiniz.</p>

    <div class="footer">
        <p>Genixo &copy; 2026</p>
    </div>
</div>
</body>
</html>
